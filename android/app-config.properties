# 安卓 APP 打包配置。在 GitHub 网页上直接编辑这个文件，保存后会自动重新打包。

# 店铺服务器地址：客户和商家手机上打开的网址，不要带 /admin
# 例如 http://123.45.67.89:3000 或 https://shop.example.com
# 还没有服务器可以先不改：APK 照样能打包，第一次打开 APP 时会让你输入地址
SERVER_URL=http://请改成你的服务器地址:3000

# APP 名称（显示在手机桌面上）
CUSTOMER_APP_NAME=零食预订
MERCHANT_APP_NAME=商家后台

# 版本号前缀，实际版本会自动加上打包序号，例如 1.0.12
VERSION_NAME=1.0
