name: 打包安卓 APP

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: '店铺服务器地址（留空就用 android/app-config.properties 里的）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_VERSION: '8.11.1'
    steps:
      - name: 下载代码
        uses: actions/checkout@v5

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查服务器地址
        id: cfg
        shell: bash
        env:
          INPUT_URL: ${{ github.event.inputs.server_url }}
        run: |
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then
            URL=$(grep -E '^SERVER_URL=' android/app-config.properties | head -n 1 | cut -d= -f2- | tr -d '\r' | xargs)
          fi
          URL="${URL%/}"
          if [ -z "$URL" ] || echo "$URL" | grep -q '请改成'; then
            echo "::warning::还没填服务器地址。APK 照样会打包，第一次打开 APP 时需要手动输入店铺地址。"
            URL=""
          else
            case "$URL" in
              http://*|https://*) ;;
              *) echo "::error::服务器地址要以 http:// 或 https:// 开头，现在是「$URL」"; exit 1 ;;
            esac
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: 准备签名
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SNACK_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: 安装 Gradle
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: 打包
        shell: bash
        working-directory: android
        env:
          SERVER_URL: ${{ steps.cfg.outputs.url }}
          SNACK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SNACK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SNACK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$SERVER_URL" ]; then
            gradle assembleRelease --no-daemon --stacktrace -PserverUrl="$SERVER_URL"
          else
            gradle assembleRelease --no-daemon --stacktrace -PserverUrl="none"
          fi

      - name: 整理安装包
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/customer/release/app-customer-release.apk dist/snack-customer.apk
          cp android/app/build/outputs/apk/merchant/release/app-merchant-release.apk dist/snack-merchant.apk
          ls -lh dist

      - name: 上传安装包
        uses: actions/upload-artifact@v6
        with:
          name: snack-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
